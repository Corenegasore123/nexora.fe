name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
